<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaojifeng Video Design · 表达目录</title><style>
:root{--paper:#f3f3ee;--ink:#193133;--muted:#637575;--line:#cdd7ce;--accent:#db5934}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui,"PingFang SC",sans-serif}main{max-width:1480px;margin:auto;padding:30px clamp(16px,4vw,58px)}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-1.5px;line-height:1.2;margin:14px 0}h2{font-size:23px;line-height:1.35}p{margin:10px 0}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:1.5px;font-weight:750}.muted{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:28px;margin-top:28px}.controls{display:grid;gap:10px;border-top:2px solid var(--ink);padding-top:16px}label{display:grid;font-size:12px;gap:4px}input,select,button{font:inherit}input[type=search],select{width:100%;min-width:0;background:#fffef8;border:1px solid var(--line);padding:9px;border-radius:5px;color:var(--ink)}button{cursor:pointer;border:1px solid var(--line);background:#fffef8;color:var(--ink);border-radius:5px;padding:7px 12px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #db593477;outline-offset:2px}.item-list{display:grid;gap:8px;max-height:65vh;overflow:auto;padding:4px 4px 12px 0}.item{display:block;text-align:left;width:100%;padding:12px 14px}.item[aria-pressed=true]{background:#e4ece5;border-color:#486f66;box-shadow:inset 3px 0 #486f66}.item strong{display:block;font-size:15px}.item small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.viewer{min-width:0;position:sticky;top:20px;align-self:start}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid #96aaa0;border-radius:12px;background:var(--bg,#f5f7fa);color:var(--fg,#172033);isolation:isolate}.grid{position:absolute;inset:-12%;background-image:linear-gradient(var(--fg) 1px,transparent 1px),linear-gradient(90deg,var(--fg) 1px,transparent 1px);background-size:44px 44px;opacity:.055}.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;will-change:transform}.object{position:absolute;left:12%;top:30%;width:31%;height:39%;border:2px solid currentColor;border-radius:var(--radius,12px);display:flex;align-items:center;justify-content:center;background:var(--bg);text-align:center;padding:12px;font-size:clamp(14px,2.1vw,27px);font-weight:650;box-shadow:0 15px 40px #0000000c}.object.b{left:58%;width:29%;border-color:var(--ac,#2463eb);color:var(--ac,#2463eb)}.connector{position:absolute;inset:0;width:100%;height:100%;color:var(--ac,#2463eb)}.connector path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:0}.stage-title{position:absolute;top:8%;left:7%;font-size:clamp(12px,1.5vw,20px);font-weight:650;z-index:2;max-width:85%;overflow-wrap:anywhere}.stage-note{position:absolute;bottom:6%;left:7%;font-size:clamp(10px,1vw,13px);opacity:.65;z-index:2}.chips{position:absolute;left:12%;right:12%;top:72%;display:flex;gap:10px}.chip{flex:1;border:1px solid currentColor;border-radius:20px;text-align:center;font-size:clamp(9px,1vw,13px);padding:3px 6px;background:var(--bg)}.number{position:absolute;font-size:clamp(22px,5vw,66px);font-weight:700;left:12%;right:57%;top:32%;height:35%;display:none;text-align:center;color:var(--ac)}.transport{display:flex;align-items:center;gap:12px;margin:12px 0;flex-wrap:wrap}.transport input{flex:1;min-width:100px;accent-color:#d85b35}.time{font-size:12px;font-variant-numeric:tabular-nums;min-width:88px}.style-control{max-width:300px}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.detail-head h2{margin-bottom:4px}.identifier{font:12px ui-monospace,monospace;overflow-wrap:anywhere}.details{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.details ul{padding-left:20px}.details li{margin:6px 0}summary{cursor:pointer;font-weight:650}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e6ebe4;padding:14px;border-radius:5px;font-size:11px;max-height:400px;overflow:auto}.badge{display:inline-block;font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:3px;margin:3px 4px 0 0}.notice{padding:12px 15px;background:#e8eee5;border-left:3px solid #537b6b;margin:16px 0}a{color:#286d75;overflow-wrap:anywhere}.empty{border:1px dashed var(--line);padding:18px}.copy-state{min-height:22px;color:var(--muted);font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}.viewer{position:static;grid-row:1}.item-list{max-height:none}.stage{border-radius:6px}.object{font-size:15px}.transport{gap:7px}.detail-head{align-items:flex-start}.details{font-size:14px}main{padding-top:20px}}
</style></head><body><main><header><a href="index.html">← 返回风格画廊</a><div class="eyebrow">CHAOJIFENG / VIDEO DESIGN</div><h1>从内容选画面</h1><p>先选要表达的关系，再组合风格与动作。配方可以改，事实与交付要能核对。</p><p class="muted">本地表达目录 · 无网络资源依赖 · 结构与动作示意 · 不代表完整影片或全部引擎验证</p></header><div class="layout"><aside><div class="controls"><label>搜索用途、名称或限制<input id="search" aria-label="搜索用途、名称或限制" type="search" placeholder="例如 因果、截图、长中文"></label><label>目录类型<select id="kind" aria-label="目录类型"><option value="all">全部</option><option value="scenario">场景配方</option><option value="style">视觉风格</option><option value="motion">动效模式</option><option value="expression">表达指导</option><option value="recipe">组合配方</option></select></label><label>按场景筛选<select id="scenario" aria-label="按场景筛选"><option value="">所有场景</option></select></label><label>风格分类<select id="category" aria-label="风格分类"><option value="">所有分类</option></select></label><p id="count" class="muted" aria-live="polite"></p></div><div id="items" class="item-list"></div></aside><article class="viewer"><div class="stage" id="stage"><div class="grid" id="grid"></div><div class="stage-title" id="stage-title">主体与关系</div><div class="scene" id="scene"><svg class="connector" viewBox="0 0 1000 563" preserveAspectRatio="none" aria-hidden="true"><path id="path" d="M 435 280 C 500 280, 510 280, 575 280"></path></svg><div class="object" id="object-a">内容主体</div><div class="object b" id="object-b">变化结果</div><div class="number" id="number">0</div><div class="chips"><div class="chip">识别</div><div class="chip">变化</div><div class="chip">理解</div></div></div><div class="stage-note" id="stage-note">原创无声示意 · 4 秒循环 · 可拖动时间</div></div><div class="transport"><button id="play" type="button" aria-pressed="false">播放示意</button><input id="seek" type="range" min="0" max="4000" value="0" step="1" aria-label="预览时间"><span class="time" id="time">0.00 / 4.00秒</span></div><label class="style-control">通用动作示意的视觉风格<select id="preview-style" aria-label="通用动作示意的视觉风格"></select></label><div class="detail-head"><div><h2 id="title"></h2><div class="identifier" id="identifier"></div></div><button id="copy" type="button">复制ID</button></div><div class="copy-state" id="copy-state" aria-live="polite"></div><p id="intent"></p><p id="style-links"></p><div id="tags"></div><div class="notice" id="verification"></div><div class="details"><h3>适用与输入</h3><div id="inputs"></div><h3>组合限制</h3><div id="constraints"></div><h3>失败时怎样调整</h3><div id="fallback"></div><details><summary>展开完整目录合同</summary><pre id="contract"></pre></details></div></article></div><footer class="muted"><p>目录更新后运行 scripts/build_gallery.py。示意播放不改变目录验证状态；成片仍需实际导出、观看与试听。</p></footer></main><script>
const catalog=__CATALOG_JSON__;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id), kinds={scenario:'场景配方',style:'视觉风格',motion:'动效模式',expression:'表达指导',recipe:'组合配方'};
const records=Object.keys(kinds).flatMap(kind=>(catalog[kind]||[]).map(item=>({...item,kind})));
let selected=records[0], motion='reveal', playing=false, elapsed=0, last=0, frame=null;
const a=$('object-a'),b=$('object-b'),path=$('path'),scene=$('scene'),grid=$('grid'),number=$('number'),chips=[...document.querySelectorAll('.chip')];
$('scenario').innerHTML+='<option value="" disabled>────────</option>'+catalog.scenario.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
$('preview-style').innerHTML=catalog.style.filter(x=>!x.origin).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
$('category').innerHTML+=[...new Set(catalog.style.map(x=>x.category).filter(Boolean))].map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
function renderList(){const term=$('search').value.trim().toLowerCase(),kind=$('kind').value,sc=catalog.scenario.find(x=>x.id===$('scenario').value);const filtered=records.filter(x=>(kind==='all'||x.kind===kind)&&(!$('category').value||x.kind==='style'&&x.category===$('category').value)&&(!term||JSON.stringify(x).toLowerCase().includes(term))&&(!sc||(x.kind==='scenario'?x.id===sc.id:((sc[x.kind+'_ids']||[]).includes(x.id)||x.kind==='style'&&(x.scenario_ids||[]).includes(sc.id)))));$('count').textContent=`显示 ${filtered.length} / ${records.length} 项`;$('items').innerHTML=filtered.length?filtered.map(x=>`<button class="item" type="button" data-kind="${x.kind}" data-id="${esc(x.id)}" aria-pressed="${x.kind===selected.kind&&x.id===selected.id}"><strong>${esc(x.name)}</strong><small>${kinds[x.kind]} · ${esc(x.id)}</small></button>`).join(''):'<p class="empty">没有匹配项。可以清空关键词或选择其他场景。</p>';$('items').querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>select(records.find(x=>x.id===el.dataset.id&&x.kind===el.dataset.kind))));}
function asList(value){if(Array.isArray(value))return '<ul>'+value.map(x=>'<li>'+esc(typeof x==='string'?x:JSON.stringify(x))+'</li>').join('')+'</ul>';if(value&&typeof value==='object')return '<pre>'+esc(JSON.stringify(value,null,2))+'</pre>';return '<p>'+esc(value||'见完整合同')+'</p>';}
function style(){const s=catalog.style.find(x=>x.id===$('preview-style').value)||catalog.style[0],t=s.tokens,stage=$('stage');stage.style.setProperty('--bg',t.background);stage.style.setProperty('--fg',t.foreground);stage.style.setProperty('--ac',t.accent);stage.style.setProperty('--radius',(t.radius?.value??12)+'px');stage.style.fontFamily=Array.isArray(t.font_stack)?t.font_stack.join(','):t.font_stack;renderAt(elapsed);}
function select(x){selected=x;motion=x.kind==='motion'?x.id:'hold';if(x.kind==='style')$('preview-style').value=x.id;$('title').textContent=x.name;$('identifier').textContent=kinds[x.kind]+' / '+x.id;$('intent').textContent=x.intent;$('style-links').innerHTML=x.kind==='style'?`<a href="../../styles/${esc(x.id)}/STYLE.md">风格规则与代码入口</a>`+(x.origin?' · <a href="https://lemomo-ai.github.io/lemo-opuscar/" target="_blank" rel="noopener">浏览来源样片</a>':''):'';scene.style.visibility=x.origin?'hidden':'';grid.style.visibility=x.origin?'hidden':'';$('inputs').innerHTML=asList(x.required_inputs||x.inputs||x.applicable_inputs);$('constraints').innerHTML=asList(x.constraints);$('fallback').innerHTML=asList(x.fallback);$('contract').textContent=JSON.stringify(x,null,2);$('tags').innerHTML=(x.channels||x.layouts||x.motion_character||[]).slice?.(0,6)?.map?.(v=>`<span class="badge">${esc(typeof v==='string'?v:JSON.stringify(v))}</span>`).join('')||'';$('verification').textContent='目录状态：设计 '+(x.verification?.design?.status||'未知')+' / 预览 '+(x.verification?.preview?.status||'not_run')+' / 导出 '+(x.verification?.exported?.status||'not_run')+'。此处无音频；指导项未实现或验证。示意不改变目录状态。';$('stage-title').textContent=x.kind==='motion'?x.name+' · 主体与关系':x.kind==='style'?x.name+(x.origin?' · 完整规则与源码已收录':' · 风格示意'):'内容主体 → 变化结果';$('stage-note').textContent=x.origin?'从下方链接查看材质、运动、镜头、声音与来源样片':['expression','recipe'].includes(x.kind)?'指导合同 · 当前画面仅为占位示意，未实现该表达或配方':'原创无声示意 · 4 秒循环 · 可拖动时间';$('copy-state').textContent='';elapsed=0;style();renderList();}
const clamp=(x,l=0,r=1)=>Math.max(l,Math.min(r,x)),ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
function renderAt(ms){const t=ms/1000,p=ease((t-.35)/1.35);a.style.cssText='';b.style.cssText='';scene.style.transform='';grid.style.transform='';path.style.strokeDashoffset='0';path.style.opacity='1';number.style.display='none';a.textContent='内容主体';b.textContent='变化结果';chips.forEach(x=>x.style.cssText='');
 switch(motion){
 case 'reveal':a.style.opacity=p;a.style.transform=`translateY(${(1-p)*24}px)`;break;
 case 'exit':{const q=ease((t-1)/1);a.style.opacity=1-q;a.style.transform=`translateY(${-q*22}px)`;break;}
 case 'highlight':a.style.color=t>.7?'var(--ac)':'var(--fg)';a.style.opacity=.55+.45*p;break;
 case 'trace':path.style.strokeDashoffset=200*(1-p);break;
 case 'connect':path.style.strokeDashoffset=200*(1-p);path.style.opacity=p;break;
 case 'count':a.style.opacity='0';number.style.display='block';number.textContent=Math.round(100*p);break;
 case 'state-swap':a.textContent=t<1.25?'原始状态':'更新状态';a.style.opacity=t<1.25?1-clamp((t-1)/.25):clamp((t-1.25)/.3);break;
 case 'camera-focus':scene.style.transform=`translate(${-p*11}%,${p*3}%) scale(${1+p*.23})`;break;
 case 'mask-wipe':a.style.clipPath=`inset(0 ${(1-p)*100}% 0 0)`;break;
 case 'stagger':chips.forEach((x,i)=>{const q=ease((t-.3-i*.35)/.6);x.style.opacity=q;x.style.transform=`translateY(${(1-q)*12}px)`;});break;
 case 'parallax':grid.style.transform=`translateX(${-p*28}px)`;a.style.transform=`translateX(${p*20}px)`;b.style.transform=`translateX(${-p*12}px)`;break;
 case 'hold':if(selected.kind==='motion'){a.textContent='保持可读';b.textContent='等待理解';}break;
 }
 $('seek').value=Math.round(ms);$('time').textContent=(ms/1000).toFixed(2)+' / 4.00秒';
}
function pause(){playing=false;if(frame!==null)cancelAnimationFrame(frame);frame=null;$('play').textContent='播放示意';$('play').setAttribute('aria-pressed','false');}
function tick(now){if(!playing)return;if(last)elapsed=(elapsed+now-last)%4000;last=now;renderAt(elapsed);frame=requestAnimationFrame(tick);}
$('play').addEventListener('click',()=>{if(playing)pause();else{playing=true;last=0;$('play').textContent='暂停';$('play').setAttribute('aria-pressed','true');frame=requestAnimationFrame(tick);}});
$('seek').addEventListener('input',()=>{pause();elapsed=Number($('seek').value);renderAt(elapsed)});
['search','kind','scenario','category'].forEach(id=>$(id).addEventListener('input',renderList));$('preview-style').addEventListener('input',style);
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(selected.id);$('copy-state').textContent='已复制 '+selected.id;}catch{$('copy-state').textContent='请复制上方ID：'+selected.id;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});select(selected);
</script></body></html>
